services:
  olms-db:
    image: postgres:16-alpine
    container_name: olms-db
    environment:
      POSTGRES_DB: olms
      POSTGRES_USER: olms
      POSTGRES_PASSWORD: olms123
    volumes:
      - olms_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olms -d olms"]
      interval: 5s
      timeout: 5s
      retries: 10

  olms-cache:
    image: redis:7.2-alpine
    container_name: olms-cache
    ports:
      - "6379:6379"

  olms-mq:
    image: rabbitmq:3.12-management-alpine
    container_name: olms-mq
    ports:
      - "5672:5672"
      - "15672:15672"

  olms-backend:
    build: ./backend
    container_name: olms-backend
    depends_on:
      olms-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: olms-db
      DB_PORT: 5432
      DB_NAME: olms
      DB_USER: olms
      DB_PASSWORD: olms123
    ports:
      - "8080:8080"

  olms-frontend:
    build: ./frontend
    container_name: olms-frontend
    depends_on:
      - olms-backend
    ports:
      - "3000:80"

  olms-nginx:
    image: nginx:1.25-alpine
    container_name: olms-nginx
    depends_on:
      - olms-frontend
      - olms-backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  olms_pg_data:
