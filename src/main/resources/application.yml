server:
  port: 8080

spring:
  application:
    name: olms-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:docker}
  jpa:
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

olms:
  jwt:
    secret: olms-mvp-secret-key-toi-thieu-32-ky-tu-!!
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  fine-per-day-vnd: 2000
  max-active-loans: 5
  loan-expiry-hours: 48

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:olms-db}:${DB_PORT:5432}/${DB_NAME:olms}
    username: ${DB_USER:olms}
    password: ${DB_PASSWORD:olms123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:olms;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
